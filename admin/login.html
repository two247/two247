<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login | TWO247 Portal</title>
  <link rel="icon" type="image/svg+xml" href="../assets/logo/owl-mark.svg">
  <link rel="stylesheet" href="../css/output.css">
  <link rel="stylesheet" href="css/admin.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="bg-[#0A0A0C] text-white min-h-screen flex items-center justify-center p-4">

  <!-- Glow effect -->
  <div class="fixed -top-40 -left-40 w-96 h-96 bg-amber-500/10 rounded-full blur-3xl pointer-events-none"></div>
  <div class="fixed -bottom-40 -right-40 w-96 h-96 bg-slate-500/10 rounded-full blur-3xl pointer-events-none"></div>

  <div class="relative z-10 max-w-md w-full bg-[#121216] border border-white/10 rounded-3xl p-8 sm:p-10 shadow-2xl">
    
    <!-- Logo & Title -->
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center mb-4">
        <img src="../assets/logo/two247-logo-white.png" alt="TWO247" class="h-10 w-auto">
      </div>
      <h1 class="text-2xl font-bold text-white tracking-tight">Concierge Admin Portal</h1>
      <p class="text-xs text-slate-400 mt-1">Sign in with authorized administrator credentials</p>
    </div>

    <!-- Error Banner -->
    <div id="login-error" class="hidden mb-6 p-4 rounded-xl bg-rose-500/10 border border-rose-500/20 text-rose-400 text-xs flex items-center gap-2">
      <svg class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
      <span id="login-error-text">Invalid email or password.</span>
    </div>

    <!-- Login Form -->
    <form id="admin-login-form" class="space-y-5">
      <div>
        <label for="admin-email" class="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-2">Admin Email</label>
        <input type="email" id="admin-email" required placeholder="admin@two247.in"
          class="w-full px-4 py-3 rounded-xl bg-white/5 border border-white/10 text-white text-sm focus:outline-none focus:border-white focus:bg-white/10 transition-all">
      </div>

      <div>
        <label for="admin-password" class="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-2">Password</label>
        <input type="password" id="admin-password" required placeholder="••••••••••••"
          class="w-full px-4 py-3 rounded-xl bg-white/5 border border-white/10 text-white text-sm focus:outline-none focus:border-white focus:bg-white/10 transition-all">
      </div>

      <button type="submit" id="login-submit-btn"
        class="w-full py-3.5 rounded-xl bg-white text-black font-bold text-sm hover:bg-slate-200 transition-all shadow-lg flex items-center justify-center gap-2 cursor-pointer">
        <span>Sign In to Dashboard</span>
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
      </button>
    </form>

    <!-- Quick Preview Bypass -->
    <div class="mt-8 pt-6 border-t border-white/10 text-center">
      <p class="text-[11px] text-slate-500 mb-3">Testing before setting up Firebase users?</p>
      <button type="button" id="quick-demo-login"
        class="text-xs text-amber-400 hover:text-amber-300 font-medium underline transition-colors cursor-pointer">
        Enter Dashboard (Offline / Dev Preview Mode) →
      </button>
    </div>

    <div class="mt-6 text-center">
      <a href="../index.html" class="text-xs text-slate-500 hover:text-slate-300 transition-colors">
        ← Return to TWO247 Public Site
      </a>
    </div>

  </div>

  <script type="module">
    import { auth } from "../js/firebase-config.js";
    import { signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";
    import { initAuthGuard } from "./js/auth-guard.js";

    initAuthGuard();

    const form = document.getElementById("admin-login-form");
    const errorEl = document.getElementById("login-error");
    const errorText = document.getElementById("login-error-text");
    const submitBtn = document.getElementById("login-submit-btn");
    const demoBtn = document.getElementById("quick-demo-login");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorEl.classList.add("hidden");
      submitBtn.disabled = true;
      submitBtn.innerHTML = "Authenticating...";

      const email = document.getElementById("admin-email").value.trim();
      const password = document.getElementById("admin-password").value;

      try {
        await signInWithEmailAndPassword(auth, email, password);
        window.location.href = "index.html";
      } catch (err) {
        errorEl.classList.remove("hidden");
        errorText.textContent = err.message || "Failed to authenticate. Verify Firebase Auth credentials.";
        submitBtn.disabled = false;
        submitBtn.innerHTML = `<span>Sign In to Dashboard</span><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>`;
      }
    });

    demoBtn.addEventListener("click", () => {
      sessionStorage.setItem("two247_demo_admin", "true");
      window.location.href = "index.html";
    });
  </script>
</body>
</html>

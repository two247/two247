<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Sign In — TWO247 Executive Portal</title>
  <link rel="icon" type="image/svg+xml" href="../assets/logo/owl-mark.svg">
  <link rel="stylesheet" href="../css/output.css">
  <link rel="stylesheet" href="css/admin.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
</head>
<body class="bg-gradient-to-br from-slate-900 via-[#0d1527] to-slate-950 min-h-screen flex flex-col items-center justify-center p-4 sm:p-6 font-sans text-slate-800 antialiased selection:bg-black selection:text-white">

  <!-- Ambient Luxury Glow -->
  <div class="fixed top-1/4 -left-32 w-96 h-96 bg-amber-500/15 rounded-full blur-3xl pointer-events-none"></div>
  <div class="fixed bottom-1/4 -right-32 w-96 h-96 bg-blue-500/10 rounded-full blur-3xl pointer-events-none"></div>

  <!-- Main Card Container -->
  <div class="relative z-10 max-w-md w-full bg-white border border-slate-200/90 rounded-3xl p-8 sm:p-10 shadow-2xl">
    
    <!-- Header & Logo -->
    <div class="text-center mb-8">
      <a href="../index.html" class="inline-flex items-center justify-center group mb-4">
        <img src="../assets/logo/two247-logo-transparent.png" alt="TWO247 The White Owl Holidays" class="h-10 sm:h-11 w-auto object-contain transition-transform group-hover:scale-105">
      </a>
      <div class="inline-block mb-3">
        <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-slate-100 border border-slate-200 text-slate-700 text-[11px] font-semibold tracking-wide">
          <svg class="w-3.5 h-3.5 text-slate-500" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 1a4.5 4.5 0 00-4.5 4.5V9H5a2 2 0 00-2 2v6a2 2 0 002 2h10a2 2 0 002-2v-6a2 2 0 00-2-2h-.5V5.5A4.5 4.5 0 0010 1zm3 8V5.5a3 3 0 10-6 0V9h6z" clip-rule="evenodd"/></svg>
          Executive Console
        </span>
      </div>
      <h1 class="text-2xl font-extrabold text-slate-900 tracking-tight">Admin Sign In</h1>
      <p class="text-xs text-slate-500 mt-1">Authenticate to manage packages, destinations & concierge leads</p>
    </div>

    <!-- Alert Banner (Error & Success) -->
    <div id="login-alert" class="hidden mb-6 p-4 rounded-2xl border text-xs font-semibold items-start gap-3 transition-all" role="alert" aria-live="polite">
      <svg id="alert-icon" class="w-4 h-4 shrink-0 mt-0.5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>
      <div class="flex-1 space-y-2" id="login-alert-text"></div>
    </div>

    <!-- Login Form -->
    <form id="admin-login-form" class="space-y-5" novalidate>
      
      <!-- Email Field -->
      <div>
        <label for="admin-email" class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-2">
          Administrator Email
        </label>
        <div class="admin-input-group">
          <span class="admin-input-icon">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 12a4 4 0 10-8 0 4 4 0 008 0zm0 0v1.5a2.5 2.5 0 005 0V12a9 9 0 10-9 9m4.5-1.206a8.959 8.959 0 01-4.5 1.206"/></svg>
          </span>
          <input type="email" id="admin-email" required autocomplete="username" placeholder="two247web@gmail.com"
            class="admin-input py-3 rounded-xl bg-slate-50 border-2 border-slate-200 text-slate-900 text-sm font-semibold focus:outline-none focus:border-black focus:bg-white focus:ring-4 focus:ring-slate-900/5 transition-all placeholder:text-slate-400 placeholder:font-normal">
        </div>
      </div>

      <!-- Password Field with In-Input Toggle -->
      <div>
        <label for="admin-password" class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-2">
          Password
        </label>
        <div class="admin-input-group">
          <span class="admin-input-icon">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
          </span>
          <input type="password" id="admin-password" required autocomplete="current-password" placeholder="Enter your password"
            class="admin-input py-3 pr-16 rounded-xl bg-slate-50 border-2 border-slate-200 text-slate-900 text-sm font-semibold focus:outline-none focus:border-black focus:bg-white focus:ring-4 focus:ring-slate-900/5 transition-all placeholder:text-slate-400 placeholder:font-normal">
          <button type="button" id="toggle-password" class="admin-input-toggle text-xs font-semibold text-slate-500 hover:text-slate-900">
            Show
          </button>
        </div>
      </div>

      <!-- Submit Button -->
      <button type="submit" id="login-submit-btn"
        class="w-full py-3.5 rounded-xl bg-black hover:bg-slate-800 active:scale-[0.99] text-white font-bold text-sm shadow-xl hover:shadow-2xl transition-all flex items-center justify-center gap-2 cursor-pointer mt-2">
        <span id="btn-text">Sign In to Dashboard</span>
        <svg id="btn-icon" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
      </button>

    </form>

    <!-- Return to Site -->
    <div class="mt-8 pt-6 border-t border-slate-100 text-center">
      <a href="../index.html" class="text-xs font-semibold text-slate-500 hover:text-slate-900 transition-colors inline-flex items-center gap-1.5">
        <span>←</span>
        <span>Return to TWO247 Public Site</span>
      </a>
    </div>

  </div>

  <p class="mt-8 text-xs text-slate-500 text-center font-medium">
    TWO247 (The White Owl Holidays) • Confidential Administration Desk
  </p>

  <script type="module">
    import { auth } from "../js/firebase-config.js";
    import { signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";

    const form = document.getElementById("admin-login-form");
    const alertBox = document.getElementById("login-alert");
    const alertText = document.getElementById("login-alert-text");
    const submitBtn = document.getElementById("login-submit-btn");
    const btnText = document.getElementById("btn-text");
    const btnIcon = document.getElementById("btn-icon");
    const togglePassBtn = document.getElementById("toggle-password");
    const passInput = document.getElementById("admin-password");
    const emailInput = document.getElementById("admin-email");

    // Clean up any stale bypass flags
    sessionStorage.removeItem("two247_demo_admin");
    sessionStorage.removeItem("two247_demo_email");

    // Check if already authenticated via real Firebase Auth
    onAuthStateChanged(auth, (user) => {
      if (user) {
        window.location.href = "index.html";
      }
    });

    // Password visibility toggle
    togglePassBtn.addEventListener("click", () => {
      const isPass = passInput.type === "password";
      passInput.type = isPass ? "text" : "password";
      togglePassBtn.textContent = isPass ? "Hide" : "Show";
      togglePassBtn.setAttribute("aria-label", isPass ? "Hide password" : "Show password");
    });

    function showAlert(htmlContent, isError = true) {
      alertBox.className = isError 
        ? "mb-6 p-4 rounded-2xl border bg-rose-50 border-rose-200 text-rose-800 text-xs font-semibold items-start gap-3"
        : "mb-6 p-4 rounded-2xl border bg-emerald-50 border-emerald-200 text-emerald-800 text-xs font-semibold items-start gap-3";
      alertText.innerHTML = htmlContent;
      alertBox.classList.remove("hidden");
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      alertBox.classList.add("hidden");

      const email = emailInput.value.trim();
      const password = passInput.value;

      if (!email || !password) {
        showAlert("Please enter both email address and password.");
        return;
      }

      // UI Loading state
      submitBtn.disabled = true;
      btnText.textContent = "Verifying Credentials...";
      btnIcon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>`;
      btnIcon.classList.add("animate-spin");

      try {
        await signInWithEmailAndPassword(auth, email, password);
        sessionStorage.removeItem("two247_demo_admin");
        showAlert("<span>Authentication successful! Redirecting to Dashboard...</span>", false);
        setTimeout(() => {
          window.location.href = "index.html";
        }, 500);
      } catch (err) {
        console.error("Firebase Auth Error:", err);
        let userMsg = "Authentication failed. Please verify your email and password.";

        if (err.code === "auth/invalid-credential" || err.code === "auth/wrong-password") {
          userMsg = "Incorrect email or password. Please verify your credentials.";
        } else if (err.code === "auth/user-not-found") {
          userMsg = "No administrator user found with this email in Firebase Auth.";
        } else if (err.code === "auth/invalid-email") {
          userMsg = "Please enter a valid email address.";
        } else if (err.code === "auth/too-many-requests") {
          userMsg = "Access temporarily disabled due to too many failed attempts. Please try again later.";
        } else if (err.code === "auth/network-request-failed") {
          userMsg = "Network connection error. Check your internet connectivity.";
        } else if (err.code === "auth/operation-not-allowed" || (err.message && err.message.includes("permission-denied"))) {
          userMsg = "Firebase Auth Error: Email/Password provider is not enabled on this project. Please enable it in Firebase Console > Authentication > Sign-in method.";
        } else if (err.message) {
          userMsg = err.message;
        }

        showAlert(`<span>${userMsg}</span>`, true);
        submitBtn.disabled = false;
        btnText.textContent = "Sign In to Dashboard";
        btnIcon.classList.remove("animate-spin");
        btnIcon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M14 5l7 7m0 0l-7 7m7-7H3"/>`;
      }
    });
  </script>
</body>
</html>

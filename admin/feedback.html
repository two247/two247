<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reviews & Feedback CRUD | TWO247 Admin Portal</title>
  <link rel="icon" type="image/svg+xml" href="../assets/logo/owl-mark.svg">
  <link rel="stylesheet" href="../css/output.css">
  <link rel="stylesheet" href="css/admin.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="bg-[#F8FAFC] flex min-h-screen">

  <!-- Sidebar -->
  <aside class="admin-sidebar w-64 flex-shrink-0 flex flex-col justify-between p-6 hidden md:flex border-r border-slate-800">
    <div>
      <div class="flex items-center gap-3 pb-6 mb-6 border-b border-white/10">
        <img src="../assets/logo/two247-logo-white.png" alt="TWO247" class="h-8 w-auto">
        <span class="text-[10px] font-bold uppercase tracking-wider text-amber-400 bg-amber-400/10 px-2 py-0.5 rounded-full border border-amber-400/20">Admin</span>
      </div>

      <nav class="space-y-1.5">
        <a href="index.html" class="admin-nav-item">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
          <span>Dashboard</span>
        </a>
        <a href="packages.html" class="admin-nav-item">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/></svg>
          <span>Packages CRUD</span>
        </a>
        <a href="destinations.html" class="admin-nav-item">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3.055 11H5a2 2 0 012 2v1a2 2 0 002 2 2 2 0 012 2v2.945M8 3.935V5.5A2.5 2.5 0 0010.5 8h.5a2 2 0 012 2 2 2 0 104 0 2 2 0 012-2h1.064M15 20.488V18a2 2 0 012-2h3.064"/></svg>
          <span>Destinations & Base Prices</span>
        </a>
        <a href="feedback.html" class="admin-nav-item active">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"/></svg>
          <span>Reviews & Feedbacks</span>
        </a>
        <a href="media.html" class="admin-nav-item">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
          <span>Cloudinary Media Studio</span>
        </a>
        <a href="inquiries.html" class="admin-nav-item">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"/></svg>
          <span>Customer Leads</span>
        </a>
      </nav>
    </div>

    <div class="pt-6 border-t border-white/10">
      <div class="text-xs text-slate-400 truncate mb-3" id="admin-user-email">admin@two247.in</div>
      <button onclick="handleAdminSignOut()" class="w-full py-2.5 px-3 rounded-xl bg-white/10 hover:bg-white/20 text-slate-300 hover:text-white text-xs font-semibold flex items-center justify-center gap-2 transition-all cursor-pointer">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
        <span>Sign Out</span>
      </button>
    </div>
  </aside>

  <!-- Main Stage -->
  <main class="flex-1 flex flex-col min-w-0 overflow-y-auto">
    <header class="bg-white border-b border-slate-200 px-6 sm:px-10 py-5 flex items-center justify-between sticky top-0 z-20">
      <div>
        <h1 class="text-xl sm:text-2xl font-bold text-slate-900 tracking-tight">Client Feedback & Reviews</h1>
        <p class="text-xs text-slate-500 mt-0.5">Approve, edit and publish verified traveler testimonials</p>
      </div>

      <button id="btn-add-review" class="px-4 py-2.5 rounded-xl bg-black text-white text-xs font-bold hover:bg-slate-800 transition-all shadow-md flex items-center gap-1.5 cursor-pointer">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4"/></svg>
        <span>Add Feedback</span>
      </button>
    </header>

    <div class="p-6 sm:p-10 space-y-6 max-w-7xl">
      <div id="reviews-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        <!-- Rendered dynamically -->
      </div>
    </div>
  </main>

  <!-- Review Modal -->
  <div id="review-modal" class="fixed inset-0 z-50 hidden opacity-0 transition-opacity duration-300 modal-overlay flex items-center justify-center p-4 sm:p-6" role="dialog" aria-modal="true">
    <div class="bg-white rounded-3xl max-w-lg w-full p-6 sm:p-8 shadow-2xl border border-slate-200">
      <div class="flex items-center justify-between pb-4 border-b border-slate-200 mb-5">
        <h2 id="review-modal-title" class="text-lg font-bold text-slate-900">Add Client Testimonial</h2>
        <button type="button" id="review-close-btn" class="p-2 text-slate-400 hover:text-slate-700 rounded-full hover:bg-slate-100">✕</button>
      </div>

      <form id="review-form" class="space-y-4">
        <input type="hidden" id="form-review-id">

        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">Guest Name(s) *</label>
          <input type="text" id="rev-name" required placeholder="e.g. Rohan & Sneha Kapoor"
            class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-xs focus:border-black">
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">City / Location</label>
            <input type="text" id="rev-loc" placeholder="Mumbai, India"
              class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-xs focus:border-black">
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">Destination Visited *</label>
            <input type="text" id="rev-dest" required placeholder="Maldives Overwater"
              class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-xs focus:border-black">
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">Rating (Stars)</label>
            <select id="rev-rating" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-xs focus:border-black">
              <option value="5">★★★★★ (5 Stars)</option>
              <option value="4">★★★★☆ (4 Stars)</option>
              <option value="3">★★★☆☆ (3 Stars)</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">Status</label>
            <select id="rev-status" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-xs focus:border-black">
              <option value="published">Published</option>
              <option value="pending">Pending Approval</option>
              <option value="archived">Archived</option>
            </select>
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">Testimonial Review *</label>
          <textarea id="rev-text" required rows="4" placeholder="Write the guest's holiday experience..."
            class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-xs focus:border-black"></textarea>
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">Guest Photo / Avatar URL (Cloudinary)</label>
          <input type="url" id="rev-avatar" placeholder="https://res.cloudinary.com/n4bywdyq/..."
            class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-xs focus:border-black">
        </div>

        <div class="pt-4 border-t border-slate-200 flex items-center justify-end gap-2">
          <button type="button" id="review-cancel-btn" class="px-4 py-2 rounded-xl border border-slate-300 text-xs font-bold text-slate-700">Cancel</button>
          <button type="submit" class="px-5 py-2 rounded-xl bg-black text-white text-xs font-bold hover:bg-slate-800">Save Review</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module">
    import { initAuthGuard } from "./js/auth-guard.js";
    import { getReviews, saveReview, deleteReview } from "./js/db-service.js";

    initAuthGuard(async () => {
      const container = document.getElementById("reviews-container");
      const modal = document.getElementById("review-modal");
      const form = document.getElementById("review-form");
      const modalTitle = document.getElementById("review-modal-title");
      const addBtn = document.getElementById("btn-add-review");
      const closeBtn = document.getElementById("review-close-btn");
      const cancelBtn = document.getElementById("review-cancel-btn");

      let reviews = await getReviews();

      function render() {
        container.innerHTML = reviews.map(r => `
          <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm flex flex-col justify-between">
            <div>
              <div class="flex items-center justify-between mb-4">
                <div class="flex items-center gap-3">
                  <img src="${r.avatarUrl || 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=120&q=80'}" alt="${r.clientName}" class="w-10 h-10 rounded-full object-cover border border-slate-200">
                  <div>
                    <h4 class="text-sm font-bold text-slate-900">${r.clientName}</h4>
                    <span class="text-[11px] text-slate-400">${r.clientLocation || 'Verified Traveler'}</span>
                  </div>
                </div>
                <span class="badge-pill ${r.status === 'published' ? 'bg-emerald-100 text-emerald-700' : 'bg-amber-100 text-amber-700'}">${r.status}</span>
              </div>
              
              <div class="text-amber-400 text-xs mb-2">${'★'.repeat(r.rating || 5)}</div>
              <p class="text-xs text-slate-600 leading-relaxed italic">"${r.reviewText}"</p>
              <div class="mt-3 text-[11px] font-semibold text-slate-900">Destination: ${r.destination}</div>
            </div>

            <div class="mt-5 pt-3 border-t border-slate-100 flex items-center justify-end gap-2">
              <button class="btn-edit-rev px-3 py-1.5 rounded-lg bg-slate-100 hover:bg-slate-200 text-xs font-semibold text-slate-700 cursor-pointer" data-id="${r.id}">Edit</button>
              <button class="btn-del-rev px-3 py-1.5 rounded-lg bg-rose-50 hover:bg-rose-100 text-xs font-semibold text-rose-700 cursor-pointer" data-id="${r.id}">Delete</button>
            </div>
          </div>
        `).join('');

        container.querySelectorAll(".btn-edit-rev").forEach(b => {
          b.addEventListener("click", () => openEdit(b.dataset.id));
        });
        container.querySelectorAll(".btn-del-rev").forEach(b => {
          b.addEventListener("click", () => handleDelete(b.dataset.id));
        });
      }

      function openModal() {
        modal.classList.remove("hidden");
        requestAnimationFrame(() => modal.classList.remove("opacity-0"));
      }

      function closeModal() {
        modal.classList.add("opacity-0");
        setTimeout(() => {
          modal.classList.add("hidden");
          form.reset();
          document.getElementById("form-review-id").value = "";
        }, 300);
      }

      addBtn.addEventListener("click", () => {
        modalTitle.textContent = "Add Client Testimonial";
        form.reset();
        openModal();
      });

      closeBtn.addEventListener("click", closeModal);
      cancelBtn.addEventListener("click", closeModal);

      function openEdit(id) {
        const r = reviews.find(x => x.id === id);
        if (!r) return;
        modalTitle.textContent = "Edit Testimonial";
        document.getElementById("form-review-id").value = r.id;
        document.getElementById("rev-name").value = r.clientName || "";
        document.getElementById("rev-loc").value = r.clientLocation || "";
        document.getElementById("rev-dest").value = r.destination || "";
        document.getElementById("rev-rating").value = r.rating || 5;
        document.getElementById("rev-status").value = r.status || "published";
        document.getElementById("rev-text").value = r.reviewText || "";
        document.getElementById("rev-avatar").value = r.avatarUrl || "";
        openModal();
      }

      async function handleDelete(id) {
        if (!confirm("Delete this review?")) return;
        await deleteReview(id);
        reviews = await getReviews();
        render();
      }

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const id = document.getElementById("form-review-id").value || null;
        const payload = {
          clientName: document.getElementById("rev-name").value.trim(),
          clientLocation: document.getElementById("rev-loc").value.trim(),
          destination: document.getElementById("rev-dest").value.trim(),
          rating: parseInt(document.getElementById("rev-rating").value) || 5,
          status: document.getElementById("rev-status").value,
          reviewText: document.getElementById("rev-text").value.trim(),
          avatarUrl: document.getElementById("rev-avatar").value.trim(),
          verified: true
        };
        await saveReview(payload, id);
        reviews = await getReviews();
        closeModal();
        render();
      });

      render();
    });
  </script>
</body>
</html>

<!-- ========================================================================= -->
<!-- TWO247 LUXURY WHITE PRELOADER (IconScout Owl #9223780 + Bottom Logo)     -->
<!-- ========================================================================= -->
<div id="two247-preloader" class="fixed inset-0 z-[9999] flex items-center justify-center bg-white text-brand-navy select-none" aria-label="TWO247 Luxury Travel Preloader" role="status">
  
  <!-- Subtle Ambient Pearl/Gold Glow -->
  <div class="absolute inset-0 pointer-events-none overflow-hidden" aria-hidden="true">
    <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[580px] h-[580px] bg-[radial-gradient(circle_at_center,rgba(245,158,11,0.06),transparent_70%)] rounded-full blur-3xl"></div>
  </div>

  <!-- Minimalist Skip Button (Top Right) -->
  <button id="preloader-skip" class="absolute top-6 right-6 text-[11px] uppercase tracking-widest text-slate-400 hover:text-brand-navy px-3.5 py-1.5 rounded-full border border-slate-200 hover:border-slate-400 bg-white/90 backdrop-blur-sm transition-all duration-200 z-30 cursor-pointer shadow-sm hover:scale-105 active:scale-95" aria-label="Skip preloader">
    Skip ✕
  </button>

  <div class="relative z-10 flex flex-col items-center justify-center p-6 text-center max-w-sm w-full">
    
    <!-- Clean Owl Animation (IconScout #9223780 - Watermark Free) -->
    <div class="relative w-44 h-44 sm:w-52 sm:h-52 flex items-center justify-center mb-3">
      <video 
        autoplay 
        loop 
        muted 
        playsinline 
        poster="assets/animation/owl-animation.png"
        class="w-full h-full object-contain"
        aria-label="TWO247 White Owl Animation"
      >
        <source src="assets/animation/owl-animation.mp4" type="video/mp4">
        <img src="assets/animation/owl-animation.gif" alt="TWO247 White Owl Animation" class="w-full h-full object-contain">
      </video>
    </div>

    <!-- Bottom Brand Logo (Official TWO247 Logo Only) -->
    <div class="w-44 sm:w-52 mb-4 transition-transform duration-300">
      <img src="assets/logo/two247-logo-transparent.png" alt="TWO247 The White Owl Holidays" class="w-full h-auto object-contain">
    </div>

    <!-- Minimalist Hairline Progress Bar (Zero text, silent luxury indicator) -->
    <div class="w-28 sm:w-32 h-[2px] bg-slate-100 rounded-full overflow-hidden border border-slate-200/50">
      <div id="preloader-progress-bar" class="h-full bg-gradient-to-r from-amber-400 via-amber-500 to-amber-600 rounded-full transition-all duration-100 w-0 shadow-[0_0_8px_rgba(245,158,11,0.4)]"></div>
    </div>

  </div>
</div>

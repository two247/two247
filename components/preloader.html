<!-- ========================================================================= -->
<!-- TWO247 LUXURY WHITE PRELOADER (IconScout Owl #9223780 + Bottom Logo)     -->
<!-- ========================================================================= -->
<div id="two247-preloader" class="fixed inset-0 z-[9999] flex items-center justify-center bg-white text-brand-navy select-none" aria-label="TWO247 Luxury Travel Preloader" role="status">

  <div class="relative z-10 flex flex-col items-center justify-center p-6 text-center max-w-sm w-full">
    
    <!-- Clean Owl Animation (IconScout #9223780 - Watermark Free) -->
    <div class="relative w-44 h-44 sm:w-52 sm:h-52 flex items-center justify-center mb-3" style="mix-blend-mode: multiply;">
      <video 
        autoplay 
        loop 
        muted 
        playsinline 
        poster="assets/animation/owl-animation.png"
        class="w-full h-full object-contain mix-blend-multiply"
        style="mix-blend-mode: multiply;"
        aria-label="TWO247 White Owl Animation"
      >
        <source src="assets/animation/owl-animation.mp4" type="video/mp4">
        <img src="assets/animation/owl-animation.gif" alt="TWO247 White Owl Animation" class="w-full h-full object-contain mix-blend-multiply" style="mix-blend-mode: multiply;">
      </video>
    </div>

    <!-- Bottom Brand Logo: Official TWO247 Logo + [TWO247] -->
    <div class="flex flex-col items-center justify-center mb-4">
      <div class="w-40 sm:w-48 mb-2 transition-transform duration-300">
        <img src="assets/logo/two247-logo-transparent.png" alt="TWO247 Logo" class="w-full h-auto object-contain">
      </div>
      
    </div>

    <!-- Minimalist Hairline Progress Bar -->
    <div class="w-28 sm:w-32 h-[2px] bg-slate-100 rounded-full overflow-hidden border border-slate-200/50">
      <div id="preloader-progress-bar" class="h-full bg-[#000000] rounded-full transition-all duration-100 w-0"></div>
    </div>

  </div>
</div>
